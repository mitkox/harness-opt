apiVersion: hop/v1
kind: Profile
schema_version: "0.3"

# Example only. This profile is not optimized, benchmarked, or approved.
metadata:
  name: ci-repair
  version: 0.1.0
  workflow: ci_repair
  description: >-
    CI/build repair profile with controlled writes; must not disable checks.
  notes:
    - Example only, not optimized; writes are allowed only inside the task workspace.

model:
  deployment_ref: qwen-flash-next
  family_hint: qwen
  variant_selectors:
    - dimension: model_family
      value: qwen

harness:
  name: pi
  version: ">=0.80.0"
  overlay_ref: pi-default@^1.0.0

system:
  prompt_ref: coding-system@^1.0.0

agents:
  - coding-agent@^1.0.0

skills:
  - repo-navigation@^1.0.0
  - debugging@^2.0.0
  - testing@^1.0.0
  - git@^1.0.0

tools:
  # Controlled writes; CI-specific check-removal prohibition is enforced by the
  # M4 CI pack verifier, not by M3 compilation.
  policy_ref: coding-tools@^1.0.0

context:
  policy_ref: default-context@^1.0.0

policy:
  - local-safety@^1.0.0

distribution:
  target: apm
