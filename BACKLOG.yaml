schema_version: '0.1'
project: HOP - Harness Optimization Platform
status: m0_m3_delivered_scoped_foundation_requalification_blocked
initial_assignment:
- Foundation
current_gate:
  milestone: Foundation
  status: blocked
  evidence: docs/acceptance-foundation.md
  next_roadmap_item_after_acceptance: AOP-020
status_definitions:
  implemented_scoped: Delivered scope evidenced by historical acceptance matrices, not all original outputs or current release qualification.
  partial: Implemented subset with explicit outstanding original requirements.
  in_progress: Current implementation and review work; exit gate not passed.
  blocked: Acceptance cannot pass until listed dependencies or evidence exist.
  planned: Not implemented; dependency and milestone acceptance gates still apply.
historical_acceptance:
  M0: docs/acceptance-m1.md
  M1: docs/acceptance-m1.md
  M2: docs/acceptance-m2.md
  M3: docs/acceptance-m3.md
  note: Historical matrices remain immutable; this reconciliation does not renew qualification.
rules:
  inference: registered_local_deployments_only
  release: approved_immutable_bundles_only
  grading: trusted_independent_verification
  parallelism: respect_dependencies_and_local_capacity
