[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hop"
version = "1.0.0"
description = "HOP — Harness Optimization Platform: continuous evaluation, optimization, qualification, and distribution of models, skills, prompts, tools, and agent configurations for local coding harnesses"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "pytest>=8.0",
]

[project.optional-dependencies]
test = [
  "jsonschema>=4.0",
]

[project.scripts]
hop = "hop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "unit: no sandbox, sockets, installed harness, or models required",
  "sandbox: real isolated worker/verifier execution",
  "contract: adapter and loopback protocol fixtures",
  "live: installed toolchain or model qualification",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]

# Owner-approved narrow exception (WP-1.2b, 2026-10-09): PyYAML ships no stubs and
# no offline types-PyYAML artifact exists, so the `yaml` import is exempted here.
# No other module or error code is relaxed; every other diagnostic remains an error.
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
